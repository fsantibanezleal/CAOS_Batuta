name: CI

# ADR-0074: cheap checks only. No training, no heavy install; push to trunk branches and manual dispatch.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

  e2e:
    # U11: the whole governed lifecycle, every refusal and every install channel on scratch projects and temporary homes.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install copier (the copier channel test; pipx keeps it out of the interpreter the engine runs on, ADR-0001)
        run: pipx install "copier==9.19.1"
      - name: End-to-end self-test
        env:
          BATUTA_E2E_REQUIRE: copier
        run: python -m unittest discover -s tests/e2e -p "test_*.py"

  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Content standards (no em-dash, no emoji, no user path)
        run: python scripts/check_content_standards.py
      - name: Contract versions (a breaking change needs a higher major, an additive change a higher minor)
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # skipped on a manual dispatch and on a new branch (no earlier commit to compare with)
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "no earlier commit to compare with; the contract version rule is skipped"
          else
            python plugins/batuta/scripts/batuta.py contract lint --against "$BEFORE_SHA"
          fi
